<mat-card>
  <mat-card-header>
    <mat-card-title>Iniciar Sesión</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field appearance="fill">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput type="email" [(ngModel)]="email" placeholder="ejemplo@univo.edu.mx">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" [(ngModel)]="password" placeholder="Tu contraseña">
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="hacerLogin()">Ingresar</button>
  </mat-card-actions>

  <mat-card-actions>
  <button mat-raised-button color="primary" (click)="hacerLogin()">Ingresar</button>
  </mat-card-actions>
  <mat-card-actions>
  <a routerLink="/registro" style="cursor: pointer;">¿No tienes cuenta? Regístrate aquí</a>
  </mat-card-actions>
</mat-card>
